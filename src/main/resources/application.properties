spring.application.name=lost-baggage-tracker

# Hosting platforms (e.g. Render) provide the port in $PORT; locally it stays 8080.
server.port=${PORT:8080}
# Behind a hosting proxy, trust its forwarded https headers so login redirects stay on https.
server.forward-headers-strategy=framework

# Local file database so administrator entries survive restarts (stored in ./data)
spring.datasource.url=jdbc:h2:file:./data/baggage
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.error.include-stacktrace=never

# Seed clearly labelled DEMONSTRATION records when the database is empty.
# Set to false once you hold records you are authorized to use.
baggage.demo-data.enabled=true

# Administrator account. Set BAGGAGE_ADMIN_PASSWORD in your environment.
# If it is empty, a random password is generated and printed once in the startup log.
baggage.admin.username=admin
baggage.admin.password=${BAGGAGE_ADMIN_PASSWORD:}

# Optional comma-separated allow-list of hosts (suffix match) accepted for official
# tracking links, e.g. baggage.official-url.allowed-hosts=example-airline.com,example-airport.in
# Empty = any valid https URL is accepted (an administrator is still expected to check it).
baggage.official-url.allowed-hosts=
